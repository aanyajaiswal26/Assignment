<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <title>CSS Selectors</title>
    <style>
    /* 1. Universal Selector */
    * {
        font-family: Arial;
    }

    /* 2. Element Selector */
    h1 {
        color: blue;
        text-align: center;
    }

    /* 3. Class Selector */
    .card {
        background-color: lightyellow;
        padding: 15px;
    }

    /* 4. ID Selector */
    #hero {
        color: red;
        font-size: 24px;
    }
    </style>
</head>

<body>
    <h1>My Website</h1>

 <div class="card">
    <p>This is a card using the class selector.</p>
 </div>

 <h2 id="hero">Welcome to My Website!</h2>

</html>
